name: CI

# Branch protection only needs to require the final "CI OK" check.
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels its older run; every main push keeps its own group and verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: '1'
  BUNDLE_GEMFILE: ${{ github.workspace }}/apps/fast-rspec/Gemfile

defaults:
  run:
    working-directory: apps/fast-rspec

jobs:
  # Which areas did this change touch? `code` is everything the test, package and demo jobs
  # read; a docs-only PR skips them and `CI OK` counts the skip. Lint always runs: the
  # public-tree guard reads every tracked file. A push to main runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      pull-requests: read
    # The PR files API lists at most 3,000 files, so a larger PR cannot be proven docs-only: it runs.
    outputs:
      code: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'demo/**'
              - 'bin/**'
              - 'Gemfile*'
              - 'mise.toml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint / RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: .ruby-version, bundler-cache: true, working-directory: apps/fast-rspec }
      - run: bundle exec rubocop --parallel
      - name: Public tree
        env:
          # The public-tree guard's private words (bin/check-public-tree). Required on this
          # repository's own runs, where the secret exists; forks and Dependabot get none.
          PUBLIC_TREE_PRIVATE_WORDS: ${{ secrets.PUBLIC_TREE_PRIVATE_WORDS }}
          PUBLIC_TREE_PRIVATE_WORDS_REQUIRED: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' && '1' || '' }}
        working-directory: .
        run: bash bin/check-public-tree --self-test && bash bin/check-public-tree

  test:
    name: Test / ${{ matrix.ruby }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # A PR runs the support floor (3.2, the gemspec minimum, catches a too-new API) and the
        # pinned Ruby; main runs the whole matrix, JRuby and TruffleRuby included.
        ruby: ${{ fromJSON(github.event_name == 'pull_request' && '["3.2", "4.0"]' || '["3.2", "3.4", "4.0", "jruby", "truffleruby"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '${{ matrix.ruby }}', bundler-cache: true }
      - if: ${{ !startsWith(matrix.ruby, 'jruby') && !startsWith(matrix.ruby, 'truffleruby') }}
        run: bundle exec rake compile
      - run: bundle exec rake test
      - name: PureRuby twin
        if: ${{ !startsWith(matrix.ruby, 'jruby') && !startsWith(matrix.ruby, 'truffleruby') }}
        run: FAST_RSPEC_DISABLE_EXT=1 bundle exec rake test

  package:
    name: Package / build + smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: .ruby-version, bundler-cache: true, working-directory: apps/fast-rspec }
      - run: bundle exec rake smoke

  demo:
    name: Demo apps / upstream vs fast_rspec
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: .ruby-version, bundler-cache: true, working-directory: apps/fast-rspec }
      # bin/stacks exits non-zero only when an upstream run fails; the fast_rspec stack is
      # expected red until roadmap M3–M4, so STRICT/DEMO_JS are deliberately not set here.
      - name: demo/ruby (upstream gates; fast_rspec expected red)
        working-directory: demo/ruby
        run: bin/stacks
      - name: demo/rails (upstream gates; fast_rspec expected red)
        working-directory: demo/rails
        run: bin/stacks

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint, test, package, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout step here, so the workflow-level working-directory would not exist for its shell.
    defaults:
      run:
        working-directory: .
    steps:
      # `skipped` passes only where `Changes` proved the diff touches no code; anything else
      # (failure, cancelled, or a skip with code changed) fails.
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Results: $RESULTS (code changed: $CODE)"
          for r in $RESULTS; do
            [ "$r" = success ] && continue
            [ "$r" = skipped ] && [ "$CODE" = false ] && continue
            exit 1
          done
