# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy — developerz-ai/fast_rspec
#
# AI-MANAGED from day one (2026-10-31). The agent handles issues, pull requests and updates end to
# end, for everyone: outside contributors, collaborators, the owner and the dependency bots. It
# triages, answers, reviews, declines with a reason, merges, and closes what has stalled on its
# reporter or author. A PR merges once its author marks it ready, it has been reviewed, and "CI OK"
# is green. A draft or a "WIP" / "DO NOT MERGE" title is never merged. A human is asked only for
# what `escalate` names plus the platform's hardcoded categories (security, license, CLA).
#
# Each week `release-due` judges whether a release is needed and opens a release PR when so; merging
# it IS the release (release.yml publishes when apps/fast-rspec/lib/fast_rspec/version.rb changes on main).
#
# The gate is the repository, not this file: CI's aggregate "CI OK" check. Verify the ruleset with
# `gh api repos/developerz-ai/fast_rspec/rulesets` before trusting any sentence here about it.
version: 1

tone:
  voice: friendly
  language: en

triage:
  skip_project_members: false
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question]
  close_unanswered_repro_after_days: 14
  # From AGENTS.md "Never" and the three pillars.
  non_goals:
    - "Any change that requires users to edit their existing spec/test files, helpers or support files"
    - "A new test DSL or matcher syntax. Our RSpec/Minitest implement upstream's public API exactly"
    - "Adding a runtime dependency to the gemspec, or copying upstream source (implement public behavior from docs/target + oracles)"
    - "Changing an upstream CLI flag, output format, exit code or --seed semantics"
    - "Overriding configuration the user wrote themselves (user config always wins)"
    - "Divergence between the C extension and the pure-Ruby implementation"
    - "Dropping support for a Ruby engine (CRuby, JRuby, TruffleRuby) to make another faster"
    - "Speed claims in docs without numbers in docs/benchmarks.md"
    - "Backwards-compatibility shims, dead-code comments, or speculative abstractions"
    - "Outside contributors' changes to CI, release or publish automation (.github/, .dz/, bin/, release Rake tasks, gemspec, FastRspec::VERSION); dependency-bot bumps are exempt"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit, copilot]
  auto_merge: true
  auto_merge_scope: any
  require_review: true
  required_checks:
    - "CI OK"
  close_awaiting_author_after_days: 21

review:
  enabled: true
  force: true
  depth: inline
  profile: chill
  request_changes: true
  approval: false
  high_level_summary: true
  learnings: false
  chat_auto_reply: true
  auto_review:
    enabled: true
    incremental: true
    drafts: false
    base_branches: [main]
    ignore_title_keywords: [WIP, "DO NOT MERGE"]
  anti_noise:
    severity_floor: minor
    max_comments: 10
    dedupe: true
  path_filters: []
  path_instructions:
    - path: "apps/fast-rspec/lib/fast_rspec/runner/**"
      instructions: >-
        Parent dispatch loop and worker lifecycle. Check fork safety (sockets closed before fork,
        reconnected in child), no per-example allocation in the parent hot loop, work-stealing
        stays pull-based, Ctrl-C / worker crash handling, and that results match a serial run.
    - path: "apps/fast-rspec/lib/fast_rspec/{rspec,minitest}/**"
      instructions: >-
        Drop-in boundary. Output format, exit codes, flags and seed semantics must match upstream
        exactly (docs/target/*.md). Any divergence needs a row in docs/idea/parity-divergences.md.
    - path: "apps/fast-rspec/lib/fast_rspec/batteries/**"
      instructions: >-
        Each battery: applies? / configured_by_user? / idempotent install!. User config wins; never
        double-configure. Plain Ruby must not load Rails.
    - path: "apps/fast-rspec/ext/fast_rspec/**"
      instructions: >-
        C hot path. GC safety (RB_GC_GUARD), buffer sizing, and the matching change in
        apps/fast-rspec/lib/fast_rspec/render/pure_ruby.rb with a parity test. Speed claims need before/after numbers.

release:
  manager: none
  channels: []

escalate:
  ask_before_acting: [breaking_change]

# CUT 2026-11-28 (fleet dz cost standard, from the 30-day prod census across both accounts):
# `security-release` (fleet-wide 170 firings -> 3 product merges + 17 REPORT.md-only PRs) and the
# daily `health` (270 firings -> 8 asks -> 0 merges; the platform's red-base ask already files a fix
# when `main` is red). A dependency's security fix arrives as a
# Dependabot security PR; an advisory against fast_rspec itself arrives as an issue or a GitHub
# security report, which the agent triages and fixes like any bug; its bump is the next `release-due`
# run unless a person cuts it sooner.
schedules:
  # Weekly and judged, so a merge never cuts a release (owner, 2026-11-01: "no auto, not dependabot,
  # us developerz.ai AI decides if needed"). Monday, the fleet's one release slot (owner, 2026-11-26).
  - name: release-due
    days: [mon]
    hours_utc: [3]
    brief_file: .dz/schedules/release-due.md
  # Monthly: the first Monday (`weeks_of_month`), the 2026-11-28 standard for a repo in its design
  # phase. The brief no longer checks the date itself.
  - name: improve
    days: [mon]
    weeks_of_month: [1]
    hours_utc: [8]
    brief_file: .dz/schedules/improve.md
  - name: compat
    days: [wed]
    hours_utc: [8]
    brief_file: .dz/schedules/compat.md

# Added by the developerz.ai maintainer agent: blocks from the current template this file did not have. Each states the value already in effect; edit it like any other key.

# branches: on at 60 because this file exists. A branch with no new commit
# this long is tagged archive/<branch>/<date> at its last commit, then deleted.
# false keeps every branch. See /docs/maintainer-yml.
branches:
  close_inactive_after_days: 60

# scout: off (2026-11-28 standard for a design-phase repo: a full survey run is ~14M tokens, and
# `improve`, `compat` and CI already read this tree). `broken_only` turns it back on for breakage.
scout:
  survey: off

# devops: off. The 2026-11-28 sweep turned it on here, and the same day's follow-up reverted it,
# because the watch is noisy: 240 of 401 tasks failed or were cancelled fleet-wide in 14 days.
# Dependency security bumps arrive through Dependabot (.github/dependabot.yml). `advisories` turns
# it on.
devops:
  watch: off

# care.docs_drift: off (2026-11-28 standard: fleet-wide 47 docs-drift tasks gave 8 docs-only merges
# and 33 failures).
care:
  docs_drift: off
